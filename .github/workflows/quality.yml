name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    name: pytest — ${{ matrix.os }}, python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: "3.9"
          - os: ubuntu-latest
            python: "3.13"
          - os: macos-latest
            python: "3.13"
    defaults:
      run:
        working-directory: ${{ github.workspace }}/Build/源码
    env:
      TMPDIR: ${{ github.workspace }}/Build/临时
      TMP: ${{ github.workspace }}/Build/临时
      TEMP: ${{ github.workspace }}/Build/临时
      PYTHONPYCACHEPREFIX: ${{ github.workspace }}/Build/缓存/python
      PIP_CACHE_DIR: ${{ github.workspace }}/Build/缓存/pip
      npm_config_cache: ${{ github.workspace }}/Build/缓存/npm
      RUFF_CACHE_DIR: ${{ github.workspace }}/Build/缓存/ruff
      GOCACHE: ${{ github.workspace }}/Build/缓存/go
      GOMODCACHE: ${{ github.workspace }}/Build/缓存/go-mod
      GOTMPDIR: ${{ github.workspace }}/Build/临时
      GOPATH: ${{ github.workspace }}/Build/缓存/go-path
      GOBIN: ${{ github.workspace }}/Build/输出/go-bin
      CARGO_HOME: ${{ github.workspace }}/Build/缓存/cargo
      XDG_CACHE_HOME: ${{ github.workspace }}/Build/缓存/xdg
      CCACHE_DIR: ${{ github.workspace }}/Build/缓存/ccache
      SCCACHE_DIR: ${{ github.workspace }}/Build/缓存/sccache
      NODE_COMPILE_CACHE: ${{ github.workspace }}/Build/缓存/node
    steps:
      - uses: actions/checkout@v4
      - name: Stage source and restored project inputs under Build
        run: ${{ runner.os == 'Windows' && 'python' || 'python3' }} 构建.py --stage --ci
        working-directory: ${{ github.workspace }}
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,verify]"
      - name: Test
        run: python -m pytest -q

  tests-without-dependencies:
    name: the documented runner, with nothing installed
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ github.workspace }}/Build/源码
    env:
      TMPDIR: ${{ github.workspace }}/Build/临时
      TMP: ${{ github.workspace }}/Build/临时
      TEMP: ${{ github.workspace }}/Build/临时
      PYTHONPYCACHEPREFIX: ${{ github.workspace }}/Build/缓存/python
      PIP_CACHE_DIR: ${{ github.workspace }}/Build/缓存/pip
      npm_config_cache: ${{ github.workspace }}/Build/缓存/npm
      RUFF_CACHE_DIR: ${{ github.workspace }}/Build/缓存/ruff
      GOCACHE: ${{ github.workspace }}/Build/缓存/go
      GOMODCACHE: ${{ github.workspace }}/Build/缓存/go-mod
      GOTMPDIR: ${{ github.workspace }}/Build/临时
      GOPATH: ${{ github.workspace }}/Build/缓存/go-path
      GOBIN: ${{ github.workspace }}/Build/输出/go-bin
      CARGO_HOME: ${{ github.workspace }}/Build/缓存/cargo
      XDG_CACHE_HOME: ${{ github.workspace }}/Build/缓存/xdg
      CCACHE_DIR: ${{ github.workspace }}/Build/缓存/ccache
      SCCACHE_DIR: ${{ github.workspace }}/Build/缓存/sccache
      NODE_COMPILE_CACHE: ${{ github.workspace }}/Build/缓存/node
    steps:
      - uses: actions/checkout@v4
      - name: Stage source and restored project inputs under Build
        run: ${{ runner.os == 'Windows' && 'python' || 'python3' }} 构建.py --stage --ci
        working-directory: ${{ github.workspace }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Test
        run: python checks/orchestrator.py

  inventory:
    name: the validation inventory still matches the code
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ github.workspace }}/Build/源码
    env:
      TMPDIR: ${{ github.workspace }}/Build/临时
      TMP: ${{ github.workspace }}/Build/临时
      TEMP: ${{ github.workspace }}/Build/临时
      PYTHONPYCACHEPREFIX: ${{ github.workspace }}/Build/缓存/python
      PIP_CACHE_DIR: ${{ github.workspace }}/Build/缓存/pip
      npm_config_cache: ${{ github.workspace }}/Build/缓存/npm
      RUFF_CACHE_DIR: ${{ github.workspace }}/Build/缓存/ruff
      GOCACHE: ${{ github.workspace }}/Build/缓存/go
      GOMODCACHE: ${{ github.workspace }}/Build/缓存/go-mod
      GOTMPDIR: ${{ github.workspace }}/Build/临时
      GOPATH: ${{ github.workspace }}/Build/缓存/go-path
      GOBIN: ${{ github.workspace }}/Build/输出/go-bin
      CARGO_HOME: ${{ github.workspace }}/Build/缓存/cargo
      XDG_CACHE_HOME: ${{ github.workspace }}/Build/缓存/xdg
      CCACHE_DIR: ${{ github.workspace }}/Build/缓存/ccache
      SCCACHE_DIR: ${{ github.workspace }}/Build/缓存/sccache
      NODE_COMPILE_CACHE: ${{ github.workspace }}/Build/缓存/node
    steps:
      - uses: actions/checkout@v4
      - name: Stage source and restored project inputs under Build
        run: ${{ runner.os == 'Windows' && 'python' || 'python3' }} 构建.py --stage --ci
        working-directory: ${{ github.workspace }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      # guides/VALIDATION_STATUS.md inventories the validation markers. Adding or
      # removing one without updating the document fails here rather than silently
      # leaving the document wrong.
      - name: Check the marker count
        run: python utilities/inventory_validation.py --expect 38
